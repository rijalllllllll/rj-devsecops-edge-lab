apiVersion: apps/v1
kind: Deployment
metadata:
  name: rj-edge-telemetry
  namespace: rj-edge
  labels:
    app: rj-edge-telemetry
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rj-edge-telemetry
  template:
    metadata:
      labels:
        app: rj-edge-telemetry
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: telemetry
          image: ghcr.io/rijalllllllll/rj-edge-telemetry:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: CORS_ORIGINS
              value: "https://rj-edge.example.com"
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10